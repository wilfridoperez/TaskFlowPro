name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: Prod
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Create .env.production for build
        run: |
          # Avoid writing real secrets into the build workspace/artifact.
          # App Service provides runtime env vars; the build only needs placeholders.
          cat > .env.production << 'EOF'
          NODE_ENV=production
          DATABASE_URL=postgresql://user:pass@localhost:5432/taskflow
          NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET=dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
          STRIPE_SECRET_KEY=sk_test_dummy
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXTAUTH_URL }}
          EOF
      
      - name: Clear Next.js cache
        run: rm -rf .next
      
      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Create deployment package
        run: |
          mkdir -p ./deploy
          # Next.js standalone output: deploy only what is needed to run
          # The generated `.next/standalone/server.js` does `process.chdir(__dirname)`.
          # It expects:
          # - Static files at `.next/standalone/.next/static`
          # - Public assets at `.next/standalone/public`
          mkdir -p ./deploy/.next/standalone
          # IMPORTANT: copy the full directory, including hidden `.next/` inside standalone.
          cp -a .next/standalone/. ./deploy/.next/standalone/
          mkdir -p ./deploy/.next/standalone/.next/static
          cp -r .next/static/* ./deploy/.next/standalone/.next/static/
          cp -r public ./deploy/.next/standalone/public
          # Ensure no env files are shipped in the zip (App Service injects env vars).
          rm -f ./deploy/.next/standalone/.env ./deploy/.env.production ./deploy/.env
          # Include prisma schema (optional but useful for debugging/migrations)
          cp -r prisma ./deploy/prisma
          # Minimal runtime metadata
          cp package.json package-lock.json ./deploy/
          cd ./deploy && zip -r ../deploy.zip .

      
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: deploy.zip
